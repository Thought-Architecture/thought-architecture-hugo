<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <title>{{ .Title }} — {{ .Site.Title }}</title>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header>
    <nav>
  <a href="{{ "/" | relLangURL }}">Home</a>
  <a href="{{ "about/" | relLangURL }}">About</a>
  <a href="{{ "methodology/" | relLangURL }}">Methodology</a>
  <a href="{{ "services/" | relLangURL }}">Services</a>
  <a href="{{ "identity/" | relLangURL }}">Identity</a>
  <a href="{{ "contact/" | relLangURL }}">Contact</a>

  <!-- Language Switcher -->
  <span style="margin-left:2rem;">
    <a href="{{ .Site.Home.RelPermalink | relLangURL }}" hreflang="en">EN</a> |
    <a href="{{ .Site.Home.RelPermalink | relLangURL }}" hreflang="de">DE</a>
  </span>
     </nav>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer>
    <p>© Thought Architecture</p>
  </footer>
</body>
</html>
